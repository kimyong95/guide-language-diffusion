# git clone https://github.com/wq-will/SimpleTES packages/SimpleTES
# pixi install
# pixi shell

[project]
name = "guide-language-diffusion"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "sglang==0.5.23",
    "flash-attn-4>=4.0.0b18",  # sglang requires a pre-release of it
    "transformers==5.19.*",
    "wandb",
    "ml-collections",
    "pandas",
    "matplotlib",
    "numpy",
    "scipy",
    "scikit-learn",

    # SimpleTES
    "litellm==1.83.*",
    "rich",
    "cvxpy",
    "psutil",

    # Blender
    "trimesh",
    "shapely",

    # Docking
    "PyTDC",
    "rdkit",
    "meeko",
    "gemmi",  # meeko imports it without depending on it
    "vina",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.34" }]

[tool.pixi.dependencies]
cuda-toolkit = "13.3.*"
cuda-compat = "13.3.*"
gcc = "<14"
gxx = "<14"

[tool.pixi.pypi-dependencies]
torch = { version = "==2.14.*", index = "https://download.pytorch.org/whl/cu132" }
torchvision = { version = "==0.29.*", index = "https://download.pytorch.org/whl/cu132" }

# drop torchaudio because no cuda 13.2 build exists
# https://github.com/Comfy-Org/ComfyUI/issues/14232
[tool.pixi.pypi-options.dependency-overrides]
torchaudio = { version = "*", env-markers = "sys_platform == 'never'" }

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/cuda-compat${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
PYTHONPATH = "$PIXI_WORKSPACE_ROOT:$PIXI_WORKSPACE_ROOT/packages/SimpleTES"

# Uni-Dock gets its own environment because conda-forge builds it for CUDA 12 only.
[tool.pixi.feature.unidock.dependencies]
unidock = "1.2.*"
cuda-compat = "12.9.*"

[tool.pixi.feature.unidock.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/cuda-compat${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

[tool.pixi.environments]
unidock = { features = ["unidock"], no-default-feature = true }
